name: Publish portable Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag
        required: true
        default: v0.7.1

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish portable application
        shell: pwsh
        run: |
          $version = '${{ inputs.tag }}'.TrimStart('v')
          dotnet publish desktop/PhoneFolder.Desktop/PhoneFolder.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o artifacts/publish/windows
          Copy-Item `
            -LiteralPath artifacts/publish/windows/PhoneTransfer.exe `
            -Destination "Phone-Transfer-Windows-v$version.exe"

      - name: Upload to existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ inputs.tag }}'.TrimStart('v')
          gh release upload '${{ inputs.tag }}' `
            "Phone-Transfer-Windows-v$version.exe" `
            --repo '${{ github.repository }}' `
            --clobber
